<!doctype html>
<html>
<head><meta charset="utf-8"><title>reelkit example: product launch</title></head>
<body>
<script type="module">
// Product launch for a fictional app, "Fieldnote 2". ~15 s, 1920x1080 @ 60 fps.
// Structure: hook (kinetic title) -> promise (headline) -> proof (product in 2.5D) -> features -> call to action.
import { reel, rgba, mix, ease, clamp, lerp } from '/reelkit/reel.js';

const BG = '#09090f', INK = '#f4f2fb', DIM = '#9896ab', VIOLET = '#8b6cff', CYAN = '#5ad1ff', AMBER = '#ffcf5a';

// The brand mark: a rounded tile with a folded corner, drawn in code so the file stays self-contained.
function mark(s, x, y, size, k = 1) {
  const c = s.ctx;
  c.save();
  c.translate(x, y); c.scale(k, k);
  s.glow(0, 0, size * 1.6, VIOLET, 0.35);
  const g = c.createLinearGradient(-size / 2, -size / 2, size / 2, size / 2);
  g.addColorStop(0, '#a48bff'); g.addColorStop(1, '#5b3df5');
  c.fillStyle = g; s.roundRect(-size / 2, -size / 2, size, size, size * 0.26); c.fill();
  c.fillStyle = 'rgba(255,255,255,.95)';
  const u = size / 10;
  s.roundRect(-3 * u, -2.6 * u, 6 * u, 1.1 * u, 0.55 * u); c.fill();
  s.roundRect(-3 * u, -0.55 * u, 4.4 * u, 1.1 * u, 0.55 * u); c.fill();
  s.roundRect(-3 * u, 1.5 * u, 2.8 * u, 1.1 * u, 0.55 * u); c.fill();
  c.restore();
}

// A believable app window, drawn into the tilted card.
function appWindow(s, c, w, h, t) {
  s.card({ x: 0, y: 0, w, h, r: 26, fill: '#13131c', stroke: 'rgba(255,255,255,.10)', shadow: false });
  ['#ff5f57', '#febc2e', '#28c840'].forEach((col, i) => { c.fillStyle = col; c.beginPath(); c.arc(32 + i * 24, 30, 7, 0, 7); c.fill(); });
  c.fillStyle = 'rgba(255,255,255,.04)'; c.fillRect(0, 60, 260, h - 60);
  c.fillStyle = 'rgba(255,255,255,.06)'; c.fillRect(260, 60, 1, h - 60);
  const side = ['Inbox', 'Today', 'Meetings', 'Ideas', 'Archive'];
  side.forEach((n, i) => {
    const y = 110 + i * 46;
    if (i === 2) { c.fillStyle = rgba(VIOLET, 0.18); s.roundRect(14, y - 28, 232, 40, 10); c.fill(); }
    s.text(n, { x: 44, y, size: 19, weight: i === 2 ? 600 : 500, color: i === 2 ? INK : DIM });
  });
  s.text('Design review · Thursday', { x: 300, y: 118, size: 30, weight: 700, color: INK, tracking: -0.01 });
  s.text('4 people · 38 min · auto-summary', { x: 300, y: 152, size: 17, weight: 500, color: DIM });
  // the note "writes itself": lines grow in one after another
  const lines = [0.92, 0.78, 0.85, 0.6, 0.88, 0.7, 0.5];
  lines.forEach((L, i) => {
    const k = s.tween(0.7 + i * 0.22, 0.5, 'outQuint');
    if (k <= 0) return;
    const y = 200 + i * 40;
    c.fillStyle = i === 3 ? rgba(AMBER, 0.75) : 'rgba(255,255,255,.16)';
    s.roundRect(300, y, (w - 360) * L * k, 14, 7); c.fill();
    if (i === 3) { c.fillStyle = rgba(AMBER, 0.14); s.roundRect(292, y - 9, (w - 344) * L * k, 32, 8); c.fill(); }
  });
  const kk = s.tween(2.4, 0.5, 'outBack');
  if (kk > 0) {
    s.pill('3 action items found', { x: 300, y: h - 82, size: 18, fill: rgba(VIOLET, 0.2), stroke: rgba(VIOLET, 0.5), dot: VIOLET, alpha: clamp(kk) });
  }
}

reel({ width: 1920, height: 1080, fps: 60, background: BG, grain: 0.045, vignette: 0.4 })

  // 1 · Hook: the name lands, letter by letter, under a slow push-in.
  .scene('hook', 3.4, s => {
    s.bg(BG);
    s.aurora({ colors: ['#3b23b8', '#0c5f8f', '#5a1f7a'], intensity: 0.5, seed: 3 });
    const push = lerp(1.0, 1.06, ease.inOut(s.p));
    s.camera({ zoom: push }, () => {
      s.pill('Introducing', { cx: s.cx, cy: 395, size: 28, alpha: s.tween(0.15, 0.6), color: '#d9d3ff', fill: 'rgba(255,255,255,.06)' });
      s.chars('Fieldnote 2', { x: s.cx, y: 600, size: 190, weight: 800, align: 'center', at: 0.35, stagger: 0.045, tracking: -0.035 });
      s.layer({ alpha: s.tween(1.25, 0.8) }, () => {
        s.words('Meeting notes, finally done for you.', { x: s.cx, y: 690, size: 40, weight: 500, align: 'center', color: DIM, at: 1.25, stagger: 0.05 });
      });
    });
  })

  // 2 · Promise: one idea, big, with a highlighter on the key word.
  .scene('promise', 3.6, s => {
    s.bg({ radial: ['#141026', BG], y: 0.5 });
    s.grid({ spacing: 56, color: 'rgba(255,255,255,.045)', dot: 2.5 });
    s.words('Notes that *write themselves.*', {
      x: s.cx, y: 520, size: 120, weight: 750, align: 'center', at: 0.25, stagger: 0.08, accent: INK,
      marks: [{ word: 'themselves', at: 1.0, color: rgba(VIOLET, 0.9) }], exit: 3.0,
    });
    s.words('Fieldnote listens, summarises and files every meeting.', { x: s.cx, y: 640, size: 38, weight: 500, align: 'center', color: DIM, at: 0.85, stagger: 0.035, exit: 3.05 });
  }, { transition: { type: 'zoom', duration: 0.7 } })

  // 3 · Proof: the product itself, tilted in 3D, settling flat while the note fills in.
  .scene('product', 4.8, s => {
    s.bg({ radial: ['#17123a', BG], y: 0.55, r: 0.9 });
    s.aurora({ colors: ['#4b2fd6', '#0b4f78'], intensity: 0.35, seed: 8, speed: 0.08 });
    const k = s.spring(0.05, { stiffness: 60, damping: 14 });
    const ry = lerp(0.55, 0.12, k) + s.wiggle(0.25, 0.015, 2), rx = lerp(0.35, 0.1, k) + s.wiggle(0.2, 0.01, 4);
    s.tilt({ cx: s.cx + 250, cy: s.cy + 20 + lerp(80, 0, k), w: 1100, h: 660, rx, ry: -ry, scale: lerp(0.86, 0.96, k), alpha: clamp(s.t * 3) }, (c, w, h) => appWindow(s, c, w, h, s.t));
    s.words('Every\nmeeting,\n*summarised.*', { x: 120, y: 410, size: 72, weight: 750, at: 0.4, stagger: 0.08, accent: '#b9a8ff', lineHeight: 1.06 });
    s.words('Action items pulled out and assigned.', { x: 120, y: 640, size: 28, weight: 500, color: DIM, at: 0.9, stagger: 0.03, maxWidth: 380, lineHeight: 1.35 });
  }, { transition: { type: 'whip', duration: 0.45 } })

  // 4 · Features: three cards, staggered, each with one idea.
  .scene('features', 3.8, s => {
    s.bg(BG);
    s.grid({ spacing: 56, color: 'rgba(255,255,255,.04)', dot: 2.5 });
    s.words('Built for how teams *actually* work', { x: s.cx, y: 270, size: 60, weight: 700, align: 'center', at: 0.1, stagger: 0.05, accent: '#b9a8ff' });
    const feats = [
      ['Live transcript', 'Every word, searchable, in 40+ languages.', CYAN],
      ['Smart summary', 'The three things that mattered, not thirty.', VIOLET],
      ['Auto action items', 'Owners and due dates, sent to your tools.', AMBER],
    ];
    feats.forEach(([title, body, col], i) => {
      const at = 0.45 + i * 0.12, k = s.spring(at, { stiffness: 220, damping: 22 }), a = s.tween(at, 0.35);
      const x = 240 + i * 500, y = 400 + (1 - k) * 90;
      s.layer({ alpha: a }, () => {
        s.card({ x, y, w: 440, h: 330, r: 30, fill: '#14141d' });
        s.glow(x + 70, y + 80, 90, col, 0.35);
        const c = s.ctx; c.fillStyle = col; s.roundRect(x + 44, y + 50, 56, 56, 16); c.fill();
        c.fillStyle = 'rgba(0,0,0,.35)'; s.roundRect(x + 58, y + 64 + i * 4, 28, 6, 3); c.fill(); s.roundRect(x + 58, y + 80, 20 + i * 4, 6, 3); c.fill();
        s.text(title, { x: x + 44, y: y + 180, size: 36, weight: 700, color: INK, tracking: -0.02 });
        s.words(body, { x: x + 44, y: y + 232, size: 24, weight: 500, color: DIM, at: at + 0.25, stagger: 0.02, maxWidth: 350, lineHeight: 1.4, style: 'rise' });
      });
    });
  }, { transition: { type: 'wipe', duration: 0.8, angle: 18, color: VIOLET } })

  // 5 · Call to action: the mark springs in, a quiet spark, the URL.
  .scene('cta', 3.4, s => {
    s.bg({ radial: ['#1a1338', BG], y: 0.42 });
    s.aurora({ colors: ['#4b2fd6', '#0c5f8f'], intensity: 0.3, seed: 12 });
    const k = s.spring(0.15, 'bouncy');
    mark(s, s.cx, 370, 150, Math.max(0, k));
    s.particles({ x: s.cx, y: 370, at: 0.22, count: 34, speed: 900, life: 0.8, colors: ['#ffffff', '#c3b5ff', CYAN], seed: 4, size: 3 });
    s.words('Fieldnote 2 is *available today.*', { x: s.cx, y: 600, size: 84, weight: 750, align: 'center', at: 0.5, stagger: 0.06, accent: '#c3b5ff' });
    s.layer({ alpha: s.tween(1.1, 0.6), y: (1 - s.tween(1.1, 0.8, 'outExpo')) * 20 }, () => {
      s.pill('fieldnote.app', { cx: s.cx, cy: 720, size: 30, fill: 'rgba(255,255,255,.07)', color: INK });
    });
    // fade to black on the last beat
    const out = s.out(0.45, 'inOut');
    if (out > 0) { s.ctx.fillStyle = rgba('#000', out); s.ctx.fillRect(0, 0, s.w, s.h); }
  }, { transition: { type: 'iris', duration: 0.9 } })
  .start();
</script>
</body>
</html>

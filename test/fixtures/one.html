<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script type="module">
import { reel } from '/reelkit/reel.js';
// 1-second test scene that touches most of the drawing API.
reel({ width: 640, height: 360, fps: 30, background: '#101018', grain: 0.04, motionBlur: { samples: 3, shutter: 0.5 } })
  .scene('a', 0.6, s => {
    s.bg({ radial: ['#22224a', '#101018'] });
    s.aurora({ intensity: 0.3 });
    s.words('Hello *world*', { x: s.cx, y: 170, size: 48, align: 'center', at: 0.05 });
    s.odometer(1234, { x: s.cx, y: 250, size: 40, align: 'center', at: 0.1, dur: 0.4 });
    s.particles({ x: s.cx, y: 180, at: 0.2, count: 20, seed: 3 });
  })
  .scene('b', 0.85, s => {   // 0.6 + 0.85 - 0.45 (whip overlap) = 1.0 s
    s.bg('#0b0b10');
    s.tilt({ cx: s.cx, cy: s.cy, w: 300, h: 180, ry: 0.4 * (1 - s.p) }, (c, w, h) => s.card({ x: 0, y: 0, w, h, fill: '#1c1c28' }));
    s.type('npm test', { x: 40, y: 330, size: 22, at: 0.05, cps: 40 });
    s.lineChart([1, 3, 2, 5, 4], { x: 380, y: 40, w: 220, h: 100, at: 0, dur: 0.5 });
  }, { transition: 'whip' })
  .start();
</script>
</body>
</html>
